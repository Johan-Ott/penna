<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Komponenter – Penna</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Literata:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-family: Geist, system-ui, sans-serif; font-size: 13px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 22px; padding: 40px; background: {{t.bg}}; color: {{t.text}}">
<span style="font-family: Literata, Georgia, serif; font-size: 22px; font-weight: 600">{{t.name}}</span>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="color: {{t.muted}}">Knappar · normal, hover, fokus, inaktiv</span>
<div style="display: flex; gap: 8px; align-items: center">
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: {{t.primary}}; font: inherit; font-weight: 500; color: {{t.onPrimary}}">Primär</button>
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: {{t.primaryHover}}; font: inherit; font-weight: 500; color: {{t.onPrimary}}">Hover</button>
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: {{t.primary}}; font: inherit; font-weight: 500; color: {{t.onPrimary}}; outline: 2px solid {{t.focus}}; outline-offset: 2px">Fokus</button>
<button disabled style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: {{t.disabledBg}}; font: inherit; font-weight: 500; color: {{t.disabledText}}">Inaktiv</button>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<button style="height: 32px; padding: 0 14px; border: 1px solid {{t.line}}; border-radius: 6px; background: {{t.surface}}; font: inherit; color: {{t.text}}">Sekundär</button>
<button style="height: 32px; padding: 0 14px; border: 1px solid {{t.line}}; border-radius: 6px; background: {{t.hover}}; font: inherit; color: {{t.text}}">Hover</button>
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; font: inherit; color: {{t.muted}}">Ghost</button>
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: {{t.hover}}; font: inherit; color: {{t.text}}">Ghost hover</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="color: {{t.muted}}">Fält · normal, fokus, fel</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<input type="text" placeholder="Titel" aria-label="Normal" style="height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{t.line}}; border-radius: 8px; background: {{t.surface}}; font: inherit; color: {{t.text}}">
<input type="text" value="Vinterväg" aria-label="Fokus" style="height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{t.primary}}; border-radius: 8px; background: {{t.surface}}; font: inherit; color: {{t.text}}; box-shadow: 0 0 0 3px {{t.focusRing}}">
<span style="display: flex; flex-direction: column; gap: 4px"><input type="text" value="abc" aria-label="Fel" aria-invalid="true" style="height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{t.error}}; border-radius: 8px; background: {{t.surface}}; font: inherit; color: {{t.text}}"><span style="color: {{t.error}}; font-size: 12px">Ange ett tal</span></span>
</div>
</div>

<div style="display: flex; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="color: {{t.muted}}">Växlare</span>
<div style="display: flex; gap: 10px">
<span style="width: 36px; height: 20px; box-sizing: border-box; padding: 2px; border-radius: 10px; background: {{t.primary}}; display: flex; justify-content: flex-end"><span style="width: 16px; height: 16px; border-radius: 8px; background: {{t.onPrimary}}"></span></span>
<span style="width: 36px; height: 20px; box-sizing: border-box; padding: 2px; border-radius: 10px; background: {{t.trackOff}}; display: flex"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></span></span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="color: {{t.muted}}">Segment</span>
<div style="display: flex; padding: 3px; border-radius: 8px; background: {{t.track}}">
<span style="height: 26px; padding: 0 12px; display: flex; align-items: center; border-radius: 6px; background: {{t.surface}}; font-weight: 500">Svenska</span>
<span style="height: 26px; padding: 0 12px; display: flex; align-items: center; color: {{t.muted}}">English</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="color: {{t.muted}}">Chip</span>
<div style="display: flex; gap: 6px">
<span style="height: 28px; padding: 0 12px; display: flex; align-items: center; border: 1px solid {{t.primary}}; border-radius: 14px">Vald</span>
<span style="height: 28px; padding: 0 12px; display: flex; align-items: center; border: 1px solid {{t.line}}; border-radius: 14px; color: {{t.muted}}">Ej vald</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="color: {{t.muted}}">Trädrad · normal, hover, vald, dras</span>
<div style="display: flex; flex-direction: column; gap: 2px; width: 240px; padding: 6px; border-radius: 8px; background: {{t.subtle}}">
<span style="height: 28px; padding: 0 10px; display: flex; align-items: center; border-radius: 6px">7. Natten</span>
<span style="height: 28px; padding: 0 10px; display: flex; align-items: center; border-radius: 6px; background: {{t.hover}}">8. Brevet</span>
<span style="height: 28px; padding: 0 10px 0 24px; display: flex; align-items: center; border-radius: 6px; background: {{t.selected}}; font-weight: 500">Köket</span>
<span style="height: 2px; margin: 0 10px; border-radius: 1px; background: {{t.primary}}"></span>
</div>
</div>

<div style="display: flex; gap: 10px; align-items: center">
<span role="status" style="padding: 10px 14px; border-radius: 10px; background: {{t.primary}}; color: {{t.onPrimary}}">Sparat i din mapp</span>
<span style="padding: 6px 8px; border-radius: 6px; background: {{t.text}}; color: {{t.bg}}; font-size: 12px">Fetstil · Cmd B</span>
<span style="padding: 3px 7px; border: 1px solid {{t.line}}; border-radius: 5px; font-size: 12px; color: {{t.muted}}">Cmd K</span>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const light = {
name: 'Ljust', bg: '#FFFFFF', subtle: '#F5F5F5', surface: '#FFFFFF', text: '#111111', muted: '#5C5C5C',
line: '#E0E0E0', hover: '#EFEFEF', selected: '#E6E6E6', track: '#F0F0F0', trackOff: '#D4D4D4',
primary: '#111111', primaryHover: '#333333', onPrimary: '#FFFFFF', focus: '#111111', focusRing: 'rgba(17,17,17,0.12)',
disabledBg: '#EBEBEB', disabledText: '#8A8A8A', error: '#C62828'
};
const dark = {
name: 'Mörkt', bg: '#141414', subtle: '#1B1B1B', surface: '#1F1F1F', text: '#F2F2F2', muted: '#A3A3A3',
line: '#333333', hover: '#262626', selected: '#2C2C2C', track: '#262626', trackOff: '#444444',
primary: '#F2F2F2', primaryHover: '#D4D4D4', onPrimary: '#141414', focus: '#F2F2F2', focusRing: 'rgba(242,242,242,0.15)',
disabledBg: '#262626', disabledText: '#6B6B6B', error: '#EF7A7A'
};
return { themes: [light, dark] };
}
}
</script>
</body>
</html>
