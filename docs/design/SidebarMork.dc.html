<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Sidomeny mörk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Literata:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Huvudmeny" style="width: 240px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 14px 10px; background: #1B1B1B; border-right: 1px solid #2A2A2A; font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #F2F2F2">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
<div style="width: 22px; height: 22px; border-radius: 6px; background: #F2F2F2; color: #141414; display: flex; align-items: center; justify-content: center; font-family: Literata, serif; font-size: 13px; font-weight: 600">P</div>
<div style="font-weight: 600; font-size: 14px">Penna</div>
</div>
<a href="Bibliotek.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 1px solid #333333; border-radius: 8px; background: #141414; color: #F2F2F2; text-decoration: none">
<span style="font-weight: 500">Vintervägen</span>
<span style="font-size: 11px; color: #999999">Bokhylla</span>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" style="display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 10px; border-radius: 6px; text-decoration: none; color: #F2F2F2; background: {{item.bg}}; font-weight: {{item.weight}}">
<span>{{item.label}}</span>
<span style="font-size: 11px; color: #999999">{{item.key}}</span>
</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px 6px"><span style="font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: #999999">Struktur</span><button aria-label="Ny scen" style="width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; font: inherit; color: #A3A3A3">+</button></div>
<sc-for list="{{tree}}" as="t" hint-placeholder-count="12">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 {{t.pad}}; border-radius: 6px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}; font-weight: {{t.weight}}">
<span style="width: 12px; flex-shrink: 0; font-size: 10px; color: #999999">{{t.chev}}</span>
<span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.label}}</span>
<span style="font-size: 11px; color: #999999">{{t.meta}}</span>
</a>
</sc-for>
</div>
<div style="margin-top: auto; padding: 12px; border: 1px solid #2A2A2A; border-radius: 8px; background: #141414; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between"><span style="font-weight: 500">Idag</span><span style="color: #A3A3A3">812 / 1 000 ord</span></div>
<div style="height: 4px; border-radius: 2px; background: #2A2A2A"><div style="width: 81%; height: 4px; border-radius: 2px; background: #F2F2F2"></div></div>
<div style="font-size: 12px; color: #A3A3A3">12 dagar i rad</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["skriv","planera","framsteg","bokdesign","exportera"],"default":"skriv"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'skriv';
const nav = [
{ id: 'skriv', label: 'Skriv', key: 'G S', href: 'Main.dc.html' },
{ id: 'planera', label: 'Planera', key: 'G P', href: 'Planera.dc.html' },
{ id: 'framsteg', label: 'Framsteg', key: 'G F', href: 'Framsteg.dc.html' },
{ id: 'bokdesign', label: 'Bokdesign', key: 'G B', href: 'Bokdesign.dc.html' },
{ id: 'exportera', label: 'Exportera', key: 'G E', href: 'Exportera.dc.html' }
].map((n) => ({ ...n, bg: n.id === a ? '#2C2C2C' : 'transparent', weight: n.id === a ? '500' : '400' }));
const rows = [
[0, '▾', 'Manus', '48k', 0], [1, '▸', 'Del I · Hemkomsten', '4 kap.', 0], [1, '▾', 'Del II · Vintern', '', 0],
[2, '▸', '5. Arvid', '7,3k', 0], [2, '▸', '6. Udden', '7,0k', 0], [2, '▸', '7. Natten', '6,0k', 0], [2, '▾', '8. Brevet', '2,4k', 0],
[3, '', 'Köket', '1 240', 1], [3, '', 'Isen', '780', 0], [3, '', 'Fyren', '411', 0],
[0, '▸', 'Research', '', 0], [0, '▸', 'Papperskorg', '', 0]
];
const tree = rows.map((r) => {
const on = r[4] === 1 && a === 'skriv';
return { pad: (10 + r[0] * 14) + 'px', chev: r[1], label: r[2], meta: r[3], bg: on ? '#2C2C2C' : 'transparent', fg: on || r[0] === 0 ? '#F2F2F2' : '#C8C8C8', weight: r[0] === 0 ? '500' : '400' };
});
return { nav, tree };
}
}
</script>
</body>
</html>
