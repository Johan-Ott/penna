# A tag like v1.0.3 builds the Windows installer and a draft GitHub release with latest.json,
# which the app's updater reads once the release is published. macOS waits for an Apple
# Developer account: an unsigned Mac app does not open; add it back to the matrix then.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_COMPUTER_SECRET: ${{ secrets.VITE_GOOGLE_COMPUTER_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Penna ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      # The same installer under a name that never changes, so the website can link straight to
      # releases/latest/download/Penna-setup.exe and the file downloads without a GitHub page.
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/Penna_*_x64-setup.exe Penna-setup.exe
          gh release upload "${{ github.ref_name }}" Penna-setup.exe --clobber
