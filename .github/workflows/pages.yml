# The website in site/ on GitHub Pages. Nytt i Penna is made from the issues, so the site is
# published again whenever an issue or milestone on the board changes.
name: pages

on:
  push:
    branches: [main]
    paths: [site/**, scripts/build-news.mjs]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned, deleted]
  milestone:
    types: [created, edited, closed, opened, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-news.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
