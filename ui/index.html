<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Penna</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-subtle: #f5f5f5;
        --border: #e5e5e5;
        --text: #111111;
        --text-prose: #1a1a1a;
        --text-muted: #5c5c5c;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 240px 1fr;
        height: 100vh;
        font:
          13px system-ui,
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      aside {
        background: var(--bg-subtle);
        border-right: 1px solid var(--border);
        padding: 16px;
        overflow: auto;
      }
      main {
        display: flex;
        flex-direction: column;
        padding: 24px;
        gap: 12px;
      }
      textarea {
        flex: 1;
        width: 100%;
        max-width: 640px;
        font:
          19px/1.8 Georgia,
          serif;
        color: var(--text-prose);
        border: 1px solid var(--border);
        padding: 16px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li button {
        width: 100%;
        text-align: left;
      }
      #status,
      h3 {
        color: var(--text-muted);
      }
      #save-banner {
        display: flex;
        gap: 12px;
        align-items: center;
        max-width: 640px;
        padding: 12px 16px;
        border: 1px solid var(--text);
        border-radius: 8px;
      }
      #save-banner[hidden],
      #conflict[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <aside>
      <button id="pick">Välj mapp</button>
      <button id="new-scene" disabled>Ny scen</button>
      <p id="folder"></p>
      <h3>Scener</h3>
      <ul id="scenes"></ul>
      <h3>Konfliktkopior</h3>
      <ul id="conflicts"></ul>
      <h3>Hämtas från iCloud</h3>
      <ul id="not-downloaded"></ul>
      <h3>Osparad text efter krasch</h3>
      <ul id="recoverable"></ul>
    </aside>
    <main>
      <div id="save-banner" role="alert" hidden>
        <span id="save-banner-text"></span>
        <button id="retry-save">Försök nu</button>
      </div>
      <p id="status">Välj en projektmapp.</p>
      <textarea id="editor" disabled></textarea>
      <section id="conflict" hidden>
        <p>Scenen ändrades utanför Penna medan du skrev. Inget sparas förrän du väljer.</p>
        <textarea id="disk-text" readonly></textarea>
        <button id="keep-mine">Behåll min text</button>
        <button id="take-disk">Ta texten från disken</button>
      </section>
    </main>
    <script type="module" src="./build/ui/main.js"></script>
  </body>
</html>
