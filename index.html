<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Penna</title>
    <link rel="icon" type="image/png" href="/src/assets/penna-logo.png" />
    <script src="/theme.js"></script>
    <style>
      /* The page's colour from the first frame, before the app's styles arrive. */
      html {
        background: #f5f5f5;
      }
      html[data-theme="dark"] {
        background: #1b1b1b;
      }
      @keyframes penna-in {
        from {
          opacity: 0;
        }
      }
      #root {
        animation: penna-in 180ms ease-out;
      }
      /* The start picture: the logo and a thin line moving under it, from the first frame until
         the app has drawn more than its empty starting screen. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 22px;
        align-items: center;
        justify-content: center;
        background: inherit;
        transition:
          opacity 260ms ease-out,
          visibility 260ms;
      }
      html {
        --boot-line: #111111;
      }
      html[data-theme="dark"] {
        --boot-line: #f2f0eb;
      }
      #boot img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      #boot span {
        position: relative;
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 1px;
        background: color-mix(in srgb, var(--boot-line) 12%, transparent);
      }
      #boot span::after {
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 1px;
        background: var(--boot-line);
        animation: boot-line 1.1s ease-in-out infinite;
        content: "";
      }
      /* A tip comes in only when the start takes a while. */
      #boot p {
        max-width: 300px;
        min-height: 3em;
        margin: 0 24px;
        color: color-mix(in srgb, var(--boot-line) 60%, transparent);
        font:
          14px/1.5 system-ui,
          sans-serif;
        text-align: center;
        opacity: 0;
        animation: boot-tip 500ms ease-out 2.5s forwards;
      }
      @keyframes boot-tip {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-line {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      #root:not(:empty):not(:has(.app-starting)) + #boot {
        visibility: hidden;
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #root {
          animation: none;
        }
        #boot span::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <img src="/src/assets/penna-logo.png" alt="" />
      <span></span>
      <p id="boot-tip"></p>
    </div>
    <script src="/boot-tip.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
