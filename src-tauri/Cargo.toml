[package]
name = "penna"
version = "0.0.4"
edition = "2021"

# Android and iOS start Penna from the library; the desktop starts it from main.rs.
[lib]
name = "penna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.4.0"
serde_json = "1.0.151"
tauri-plugin-opener = "2.7.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-http = "2.8.0"
serde = { version = "1.0.229", features = ["derive"] }

# Updates come from GitHub Releases on the desktop; a phone gets them from its app store.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.1"
tauri-plugin-persisted-scope = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
trash = "5"

# A smaller release binary: link-time optimisation, one codegen unit, no debug symbols.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
