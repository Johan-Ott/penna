<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>__APP_NAME__</title>
    <style>
      /* The start picture: the app's name from the first frame until the app has drawn. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          600 28px system-ui,
          sans-serif;
        opacity: 0.5;
      }
      html:not(.starting) #root:not(:empty) + #boot {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">__APP_NAME__</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
